<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    li.completed {
      text-decoration: line-through;
      background-color: #e0ffe0;
    }
    button {
      padding: 5px 10px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff3333;
    }
    .toggle-btn {
      background-color: #4caf50;
    }
    .toggle-btn:hover {
      background-color: #45a049;
    }
    .no-todos {
      text-align: center;
      color: #888;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <ul id="todoList"></ul>
    <p id="noTodos" class="no-todos" style="display:none;">No Todos Available</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
