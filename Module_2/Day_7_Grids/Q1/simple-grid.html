<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .grid {
            display: grid;
            gap: 5px;
            grid-template-columns: repeat(3,200px);
            grid-template-rows: repeat(3,100px);
        }
        .item {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #fff;
            font-size: 25px;
        }
        .item:nth-child(1) {background-color: orangered;}
        .item:nth-child(2) {background-color: rgb(80, 80, 221);}
        .item:nth-child(3) {background-color: rgb(242, 242, 16);}
        .item:nth-child(4) {background-color: blueviolet;}
        .item:nth-child(5) {background-color: rgb(60, 193, 60);}
        .item:nth-child(6) {background-color: rgb(78, 183, 248);}
        .item:nth-child(7) {background-color: coral;}
        .item:nth-child(8) {background-color: rgb(30, 196, 196);}
        .item:nth-child(9) {background-color: brown;}
    </style>
</head>
<body>
    <div class="grid">
        <div class="item">2.</div>
        <div class="item">3.</div>
        <div class="item">4.</div>
        <div class="item">5.</div>
        <div class="item">6.</div>
        <div class="item">1.</div>
        <div class="item">7.</div>
        <div class="item">8.</div>
        <div class="item">9.</div>
    </div>
</body>
</html>
