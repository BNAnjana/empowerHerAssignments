<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplification Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f1f1f1;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: left;
        }

        .container {
            width: 70%;
            max-width: 800px;
            padding: 30px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        .header {
            margin-bottom: 0;
            background-color: #f1f1f1;
            color: rgb(11, 95, 11);
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem; 
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            color: rgb(11, 95, 11);
        }

        .section {
            margin-bottom: 0;
        }

        .section h2 {
            font-size: 2rem;        
            font-weight: bold;
            margin-bottom: 10px;
        }

        .section p {
            font-size: 1rem;
        }

        .section:nth-child(2) .content-block {
            background-color: rgb(11, 95, 11);
            color: white;
            padding: 20px;
            margin: 0;
        }

        .setion:nth-child(2) hr{
            border-top:1px solid white;
        }
        .section:nth-child(3) .content-block {
            background-color: #f1f1f1;
            color: rgb(11, 95, 11);
            padding: 20px;
        }

        hr {
            border: 0;
            border-top: 2px solid #ccc;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p>EVERYONE NEEDS INFINITE DREAMS</p>
            <hr>
            <h1><span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">Enid</span> is an <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">amplification studio</span> that builds brands that <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">resound</span>.</h1>
        </div>

        <div class="section">
            <div class="content-block">
            <p>EACH NEW IDEA DEFINED</p>
            <hr>
            <h2>We stand firm on <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">our values</span> that sit central to <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">everything we do</span>.</h2>
            </div>
        </div>

        <div class="section">
            <div class="content-block">
            <p>EVERY NOTE IS DISTINCT</p>
            <hr>
            <h2>We <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">deep-dive</span> into your back catalogue to understand the <span style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande';">beat</span>.</h2>
            </div>
        </div>
    </div>
</body>
</html>
