<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navigation Bar</title>
    <head>
        <style>
        * {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        #header, footer {
            background-color: black;
            padding: 10px;
            margin: 0;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li:first-child .nav-link {
            font-weight: bolder;
            color: blue;
            font-size: 30px;
            text-align: left;
        }
        .nav-link {
            text-decoration: none;
            color: #fff;
            font-size: 15px;
            padding: 10px;
            display: inline-block;
        }
        .nav-link:hover {
            color: blueviolet;
        }
        footer {
            font-size: 10px;
            text-align: center;
            color: #fff;
            padding: 10px 0;
        }
        </style>
    </head>
    <body>
        <header id="header">
            <nav>
                <ul>
                    <li><a href="#" class="nav-link">Beblog</a></li>
                    <li><a href="#" class="nav-link">Home</a></li>
                    <li><a href="#" class="nav-link">Web Design</a></li>
                    <li><a href="#" class="nav-link">WordPress</a></li>
                    <li><a href="#" class="nav-link">About us</a></li>
                    <li><a href="#" class="nav-link">BeAdvice</a></li>
                    <li><a href="#" class="nav-link">Buy Be Theme</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <br><br><br> <br> <br> <br> <br> <br> <br> <br> <br> <br> <br> <br>
            <br><br><br> <br> <br> <br> <br> <br> <br> <br> <br> <br> <br> <br>
            <br><br><br><br>
        </main>
        <footer>
            <p>&copy; 2024 Beblog</p>
        </footer>
    </body>
</html>
